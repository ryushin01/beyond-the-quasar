version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Histoire 1.0 베타가 Vite 7만 지원해 Vite를 7에 고정했습니다(docs/development.md의 'Vite 버전', package.json의 overrides).
      # 같은 이유로 Vite 8이 필요한 @quasar/vite-plugin 2, vitest 5, Cypress 16(컴포넌트 테스트)도 받지 않습니다.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@quasar/vite-plugin'
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: cypress
        update-types: ['version-update:semver-major']
      # typescript-eslint가 TypeScript 7을 지원하지 않아 린트가 바로 실패합니다. 지원되면 함께 올립니다.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 7은 WASM 대량 계산 API를 함께 싣는데, 그 pthreads 워커가 최상위 await를 써서 Vite의 워커(iife) 빌드가 실패합니다.
      # 쓰는 것은 JS 계산(propagate 등)뿐이라 6에 둡니다. 대량 계산이 필요해지면 worker.format을 'es'로 바꾸고 올립니다.
      - dependency-name: satellite.js
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
