name: Refresh TLE

# TLE는 시간이 지나면 오차가 커지므로 매주 공개 카탈로그에서 다시 받습니다. 근지구 소행성 접근 목록(NASA/JPL)과 우주 기상 스냅샷(NOAA)도 함께 받습니다.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run data:tle
      # 푸시하면 바로 배포되므로, 새 스냅샷을 검사한 뒤에만 올립니다.
      - run: bun run test:snapshot
      # 소행성 접근은 받지 못해도 궤도 갱신을 막지 않습니다(화면은 지난 접근을 빼고 남은 목록과 자료 날짜를 보여 줌).
      # 스크립트가 응답을 검사해 이상하면 기존 스냅샷을 그대로 둡니다.
      - name: 소행성 접근 스냅샷
        continue-on-error: true
        run: bun run data:neo
      # 우주 기상 스냅샷은 NOAA에 닿지 못할 때(오프라인·차단) 화면이 대신 보여 주는 값입니다. 받지 못하면 기존 스냅샷을 둡니다.
      - name: 우주 기상 스냅샷
        continue-on-error: true
        run: bun run data:space-weather
      - name: 변경 내용 커밋
        run: |
          git diff --quiet public/data/ && exit 0
          git config user.name 'ryushin0'
          git config user.email '141554987+ryushin01@users.noreply.github.com'
          git add public/data/tle-snapshot.json public/data/neo-snapshot.json public/data/space-weather-snapshot.json
          git commit -m "궤도·소행성·우주 기상 스냅샷 갱신"
          git pull --rebase origin main
          git push
      # 갱신이 실패하면 화면은 오래된 궤도로 계속 그리므로, 이슈를 열어 알립니다(같은 제목의 열린 이슈가 있으면 댓글만 남김).
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='궤도 스냅샷 갱신 실패'
          # 검색은 제목에 단어가 들어 있기만 해도 걸리므로, 제목이 정확히 같은 이슈만 고릅니다.
          # checkout 전에 실패해도 저장소를 알 수 있게 --repo를 줍니다.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --limit 50 --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "다시 실패했습니다: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "주간 TLE 갱신이 실패했습니다. 화면은 이전 스냅샷으로 계속 그립니다(10일이 지나면 화면에 경고가 나옵니다). 실행 기록: $RUN_URL"
          fi
